name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  context:
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    uses: escapace/workflows/.github/workflows/context.yaml@trunk

  continuous-integration:
    if: needs.context.outputs.environment == 'production' || needs.context.outputs.environment == 'staging'
    needs:
      - context
    permissions:
      contents: read
      packages: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    uses: escapace/workflows/.github/workflows/ci-typescript.yaml@trunk
    with:
      enable-codecov: ${{ !github.event.repository.private }}
      node-version: ${{ needs.context.outputs.node-version }}
      pnpm-version: ${{ needs.context.outputs.pnpm-version }}
      ref: ${{ needs.context.outputs.ref }}
      version: ${{ needs.context.outputs.version }}

  action-smoke-test:
    if: needs.context.outputs.environment == 'production' || needs.context.outputs.environment == 'staging'
    needs:
      - context
      - continuous-integration
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.context.outputs.ref }}
      - name: setup
        uses: ./
        with:
          enterprise: ${{ matrix.enterprise }}
          vault-version: ${{ matrix.version }}
      - name: check version
        run: vault --version
    strategy:
      fail-fast: false
      matrix:
        enterprise: [false, true]
        os: [ubuntu-latest]
        version:
          - ^1.21.0
          - latest

  release-github:
    if: needs.context.outputs.environment == 'production' || needs.context.outputs.environment == 'staging'
    needs:
      - context
      - continuous-integration
      - action-smoke-test
    permissions:
      contents: write
    uses: escapace/workflows/.github/workflows/release-github.yaml@trunk
    with:
      changelog: ${{ needs.context.outputs.changelog }}
      prerelease: ${{ fromJSON(needs.context.outputs.prerelease) }}
      version: ${{ needs.context.outputs.version }}
